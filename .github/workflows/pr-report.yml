name: PR-Bericht
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Browser-Tests"]
    types: [completed]
permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion != ''
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Node.js einrichten
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm test
        if: github.event_name == 'pull_request'
        id: npm_tests
        continue-on-error: true
        run: npm test
      - name: Syntax- und Versionsprüfung
        if: github.event_name == 'pull_request'
        id: repo_checks
        continue-on-error: true
        run: node scripts/check.mjs
      - name: Einen PR-Bericht aktualisieren
        if: always()
        uses: actions/github-script@v7
        env:
          NPM_OUTCOME: ${{ steps.npm_tests.outcome }}
          CHECKS_OUTCOME: ${{ steps.repo_checks.outcome }}
        with:
          script: |
            const marker = '<!-- kuhhandel-automation-pr-report -->';
            const isWorkflowRun = context.eventName === 'workflow_run';
            const run = context.payload.workflow_run;
            const prNumber = context.payload.pull_request?.number || run?.pull_requests?.[0]?.number;
            if (!prNumber) {
              core.info('Kein zugehöriger Pull Request im Event gefunden; kein Kommentar erstellt.');
              return;
            }

            const { owner, repo } = context.repo;
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            const comparison = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
              owner, repo, basehead: `${pr.base.ref}...${pr.head.sha}`
            });
            const files = (comparison.data.files || []).map(file => file.filename);
            const has = suffix => files.some(file => file === suffix || file.endsWith('/' + suffix));

            async function readText(path, ref) {
              try {
                const result = await github.rest.repos.getContent({ owner, repo, path, ref });
                if (Array.isArray(result.data) || !result.data.content) return null;
                return Buffer.from(result.data.content, result.data.encoding || 'base64').toString('utf8');
              } catch { return null; }
            }
            const [baseApp, headApp, baseVersion, headVersion, headAgents, headClaude] = await Promise.all([
              readText('js/app.js', pr.base.sha),
              readText('js/app.js', pr.head.sha),
              readText('version.json', pr.base.sha),
              readText('version.json', pr.head.sha),
              readText('AGENTS.md', pr.head.sha),
              readText('CLAUDE.md', pr.head.sha),
            ]);
            const getAppVersion = source => source?.match(/\bAPP_VERSION\s*=\s*['"]([^'"]+)['"]/)?.[1] || null;
            const getJsonVersion = source => { try { return JSON.parse(source).version || null; } catch { return null; } };
            const oldAppVersion = getAppVersion(baseApp);
            const newAppVersion = getAppVersion(headApp);
            const oldJsonVersion = getJsonVersion(baseVersion);
            const newJsonVersion = getJsonVersion(headVersion);

            const risks = [];
            if (has('src/engine.js')) risks.push('⚠️ `src/engine.js` geändert: Spiellogik besonders sorgfältig reviewen.');
            if (files.some(file => file.startsWith('supabase/') && file.endsWith('.sql'))) risks.push('⚠️ Neue/geänderte SQL-Datei: Alp muss SQL selbst prüfen und ausführen.');
            const appCodeChanged = files.some(file => /^(js\/|src\/|worker\/|css\/|sw\.js|index\.html$)/.test(file));
            const compareVersions = (a, b) => {
              const left = a.split('.').map(Number); const right = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) if ((left[i] || 0) !== (right[i] || 0)) return (left[i] || 0) - (right[i] || 0);
              return 0;
            };
            if (appCodeChanged && oldAppVersion && newAppVersion && compareVersions(newAppVersion, oldAppVersion) <= 0) risks.push(`⚠️ App-Code geändert, aber APP_VERSION nicht erhöht (alt ${oldAppVersion}, neu ${newAppVersion}).`);
            if (appCodeChanged && !has('CHANGELOG.md')) risks.push('⚠️ App-Code geändert, aber CHANGELOG.md fehlt im PR.');
            if (!headAgents || !headClaude || headAgents !== headClaude) risks.push('⚠️ AGENTS.md und CLAUDE.md fehlen oder sind nicht identisch.');
            if (newAppVersion && newJsonVersion && newAppVersion !== newJsonVersion) risks.push(`❌ APP_VERSION (${newAppVersion}) und version.json (${newJsonVersion}) weichen ab.`);
            if (oldAppVersion && newAppVersion && oldAppVersion !== newAppVersion && oldJsonVersion === newJsonVersion) risks.push('⚠️ APP_VERSION geändert, version.json aber nicht.');
            if (!risks.length) risks.push('Keine automatische Risiko-Regel hat einen Treffer ergeben. Das ersetzt kein fachliches Review.');

            const comments = (await github.rest.issues.listComments({ owner, repo, issue_number: prNumber, per_page: 100 })).data;
            const previous = comments.find(comment => comment.body?.includes(marker));
            const previousBody = previous?.body || '';
            const previousNpm = previousBody.match(/\| npm test \| ([^|]+) \|/)?.[1]?.trim() || 'Noch nicht gemeldet';
            const previousChecks = previousBody.match(/\| Syntax\/Version \| ([^|]+) \|/)?.[1]?.trim() || 'Noch nicht gemeldet';
            const previousE2e = previousBody.match(/\| Browser\/Layout \| ([^|]+) \|/)?.[1]?.trim() || 'Noch nicht gemeldet';
            let npmStatus = previousNpm;
            let checksStatus = previousChecks;
            let e2eStatus = previousE2e;
            let e2eLinks = previousBody.match(/\*\*E2E-Nachweis:\*\*[\s\S]*?(?=\n\n\*\*Geänderte Dateien:|$)/)?.[0] || '**E2E-Nachweis:** Noch kein E2E-Lauf verknüpft.';

            if (!isWorkflowRun) {
              npmStatus = process.env.NPM_OUTCOME === 'success' ? 'Bestanden' : process.env.NPM_OUTCOME === 'failure' ? 'Fehlgeschlagen' : 'Nicht ausgeführt';
              checksStatus = process.env.CHECKS_OUTCOME === 'success' ? 'Bestanden' : process.env.CHECKS_OUTCOME === 'failure' ? 'Fehlgeschlagen' : 'Nicht ausgeführt';
            } else {
              const workflowName = run.name || 'E2E Layout';
              e2eStatus = run.conclusion === 'success' ? 'Bestanden' : `Fehlgeschlagen (${run.conclusion || 'unbekannt'})`;
              const artifactsUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts`;
              e2eLinks = `**E2E-Nachweis:** [Workflow-Zusammenfassung (${workflowName})](${run.html_url}) · [Screenshots/Artefakte öffnen](${artifactsUrl})`;
            }

            const fileList = files.length ? files.map(file => `- \`${file}\``).join('\n') : '- Keine geänderten Dateien ermittelt.';
            const body = [
              marker,
              '## Automatisierter PR-Bericht',
              '',
              `**PR:** #${prNumber} · **Branch:** \`${pr.head.ref}\` → \`${pr.base.ref}\``,
              '',
              '| Prüfung | Ergebnis |',
              '|---|---|',
              `| npm test | ${npmStatus} |`,
              `| Syntax/Version | ${checksStatus} |`,
              `| Browser/Layout | ${e2eStatus} |`,
              '',
              e2eLinks,
              '',
              '**Geänderte Dateien:**',
              fileList,
              '',
              '**Risiken / Review-Hinweise:**',
              risks.map(item => `- ${item}`).join('\n'),
              '',
              '_Automatisch aktualisiert. Keine Codeänderungen, Merges, Pushes oder SQL-Aktionen; Alps GO bleibt erforderlich._'
            ].join('\n');

            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
              core.info(`Vorhandenen PR-Bericht-Kommentar ${previous.id} aktualisiert.`);
            } else {
              const created = await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              core.info(`PR-Bericht-Kommentar ${created.data.id} erstellt.`);
            }
