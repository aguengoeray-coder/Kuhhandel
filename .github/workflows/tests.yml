# Regel- und Repository-Grundprüfungen bei Pull Requests.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# neuer Push auf denselben PR bricht den alten Lauf ab (keine doppelten Läufe)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node-Tests
        run: npm test
      - name: Syntax- und Versionsprüfung
        run: node scripts/check.mjs
