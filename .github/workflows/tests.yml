# Bei jedem Pull Request und jedem Push: Regel-Tests laufen lassen (grünes Häkchen / rotes Kreuz)
name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
