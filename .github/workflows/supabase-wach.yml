# Zweite Absicherung (neben dem Cloudflare-Zeitplan): Supabase täglich kurz anfragen,
# damit das kostenlose Projekt nicht nach 7 Tagen ohne Nutzung pausiert.
# Hinweis: GitHub schaltet Zeitpläne in öffentlichen Repos nach 60 Tagen ohne Änderungen ab.
name: Supabase wach halten
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase anfragen
        run: |
          URL=$(grep -o "SUPABASE_URL = '[^']*'" js/config.js | cut -d"'" -f2)
          KEY=$(grep -o "SUPABASE_KEY = '[^']*'" js/config.js | cut -d"'" -f2)
          curl -sS -o /dev/null -w "Status %{http_code}\n" "$URL/rest/v1/games?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
